spring.application.name=Apigateway
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8671/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=videoservice
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://VIDEOSERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/videoservice/**
